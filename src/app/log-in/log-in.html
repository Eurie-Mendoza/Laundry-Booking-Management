
<section class="login-page">

  <div class="login-left">

    <span class="login-label">LOGIN</span>

    <div class="login-content">

      <h2>LOG-IN Form</h2>

      <form class="login-card" (ngSubmit)="login()">

        <div class="form-group">
          <label for="username">Username</label>

          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter staff username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            required
          />
        </div>

        @if (errorMessage) {
          <div class="login-error">
            {{ errorMessage }}
          </div>
        }

        <div class="login-actions">

          <span class="demo-credentials">
            Demo:
            <strong>admin / 1234</strong>
          </span>

          <button type="submit" [disabled]="isLoading">
            Log-in
          </button>

        </div>

      </form>

    </div>
  </div>

  <div class="login-right">

    <div class="brand-content">

      <div class="brand-icon">L</div>

      <h1>L.A.B.A.</h1>

      <h2>Laundry Automated Booking Assistant</h2>

      <p>
        A smarter and more organized way to manage your laundry
        bookings, customers, services, and payments.
      </p>

      <div class="brand-footer">
        LAUNDRY BOOKING MANAGEMENT SYSTEM
      </div>

    </div>

  </div>

</section>
